<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PulseSpace</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Primary navigation">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">P</div>
          <div>
            <strong>PulseSpace</strong>
            <span>Creator social</span>
          </div>
        </div>

        <nav class="nav-list" id="navList">
          <button class="nav-item is-active" data-view="home" type="button">
            <span class="nav-icon">H</span>
            <span>Home</span>
          </button>
          <button class="nav-item" data-view="discover" type="button">
            <span class="nav-icon">D</span>
            <span>Discover</span>
          </button>
          <button class="nav-item" data-view="create" type="button">
            <span class="nav-icon">+</span>
            <span>Create</span>
          </button>
          <button class="nav-item" data-view="search" type="button">
            <span class="nav-icon">S</span>
            <span>Search</span>
          </button>
          <button class="nav-item" data-view="communities" type="button">
            <span class="nav-icon">C</span>
            <span>Communities</span>
          </button>
          <button class="nav-item" data-view="messages" type="button">
            <span class="nav-icon">M</span>
            <span>Messages</span>
          </button>
          <button class="nav-item" data-view="profile" type="button">
            <span class="nav-icon">P</span>
            <span>Profile</span>
          </button>
        </nav>

        <div class="sidebar-profile">
          <div class="avatar">F</div>
          <div>
            <strong>Founder</strong>
            <span>@founder</span>
          </div>
        </div>
      </aside>

      <main class="main-panel">
        <header class="topbar">
          <div>
            <p class="eyebrow" id="viewEyebrow">Personalized</p>
            <h1 id="viewTitle">Home</h1>
          </div>
          <div class="topbar-status" id="topbarStatus">Backend connected</div>
        </header>

        <section class="page-frame">
          <div id="viewRoot">
            <div class="loading-card">Loading PulseSpace...</div>
          </div>
        </section>
      </main>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="./app.js"></script>
  </body>
</html>
